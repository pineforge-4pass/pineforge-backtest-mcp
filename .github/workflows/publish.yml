name: Publish to npm
run-name: Offline ${{ inputs.action == 'restore' && 'restore' || 'publish' }} ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [publish, restore]
        default: publish
        description: Replay a tagged publication, or restore recorded channels
      receipt_run_id:
        type: string
        description: Original publisher run ID (required for restoration)

# Serialize distribution/channel writes independently of receiver/reconciler
# wakeups. Reconciliation repairs a missing/cancelled tag run on the same tag.
concurrency:
  group: offline-release-publish
  cancel-in-progress: false
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
permissions:
  contents: read
  actions: read

jobs:
  gates:
    if: inputs.action != 'restore'
    uses: ./.github/workflows/test.yml

  prepare:
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Fetch recorded immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-artifacts.mjs gate
      - name: Release channel from VERSION
        id: channel
        run: node scripts/release-version.mjs channel "$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Verify merged PR, exact tag and gates; record previous channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/distribution.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: offline-channels-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-ci/channel-state.json
          if-no-files-found: error
          retention-days: 90

  image:
    needs: [gates, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Fetch recorded immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-artifacts.mjs image-input
      - name: Publish the saved tested architectures at fixed versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/distribution.mjs image
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: offline-image-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-ci/image-publication.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [gates, prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # https://docs.npmjs.com/trusted-publishers/#managing-dist-tags-with-trusted-publishing
      - run: npm install -g npm@11.21.0
      - name: Fetch recorded immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-artifacts.mjs npm-input
      - name: Prove OIDC restoration and publish the tested npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/distribution.mjs npm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: offline-oidc-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-ci/oidc-proof.json
          if-no-files-found: error
          retention-days: 90

  mcp-registry:
    needs: [publish, image, prepare]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check immutable Registry entry for replay
        id: registry
        run: node scripts/distribution.mjs registry-needed >> "$GITHUB_OUTPUT"
      - name: Install mcp-publisher
        if: steps.registry.outputs.needed == 'true'
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC) and publish
        if: steps.registry.outputs.needed == 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Verify actual Registry identity
        run: node scripts/distribution.mjs registry-verify

  release:
    needs: [publish, image, prepare, mcp-registry]
    if: >-
      always() && needs.publish.result == 'success' && needs.image.result == 'success' &&
      (needs.mcp-registry.result == 'success' ||
      (needs.prepare.outputs.prerelease == 'true' && needs.mcp-registry.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create GitHub Release with immutable manifest (no Latest movement)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/distribution.mjs github-release

  promote:
    needs: [gates, prepare, publish, image, mcp-registry, release]
    if: >-
      always() && needs.gates.result == 'success' && needs.prepare.result == 'success' &&
      needs.publish.result == 'success' && needs.image.result == 'success' && needs.release.result == 'success' &&
      (needs.mcp-registry.result == 'success' ||
      (needs.prepare.outputs.prerelease == 'true' && needs.mcp-registry.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.21.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Fetch recorded immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-artifacts.mjs promotion-input
      - name: Recheck desired release; activate and verify channels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHAIN_OWNER: ${{ vars.RELEASE_CHAIN_OWNER }}
        run: node scripts/distribution.mjs promote
      - name: Retain internal distribution identity observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: offline-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-ci/distribution-evidence.json
          if-no-files-found: error
          retention-days: 90

  restore:
    needs: [prepare, promote]
    if: >-
      always() && (inputs.action == 'restore' ||
      (needs.prepare.result == 'success' && contains(fromJSON('["failure","cancelled"]'), needs.promote.result)))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    steps:
      # Restoration code is always from trusted main, including manual calls.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.21.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate restoration source run
        id: source
        env:
          REQUESTED_RUN: ${{ inputs.receipt_run_id }}
          ACTION: ${{ inputs.action }}
        run: |
          original="$GITHUB_RUN_ID"
          if [ "$ACTION" = restore ]; then original="$REQUESTED_RUN"; fi
          [[ "$original" =~ ^[1-9][0-9]*$ ]] || { echo '::error::numeric publisher run required'; exit 1; }
          echo "run=$original" >> "$GITHUB_OUTPUT"
      - name: Fetch the original publisher's channel and image receipts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SOURCE_RUN: ${{ steps.source.outputs.run }}
        run: node scripts/release-artifacts.mjs restore-input
      - name: Restore recorded npm and GHCR channels; verify both
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_SOURCE_RUN: ${{ steps.source.outputs.run }}
        run: node scripts/distribution.mjs restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: offline-restoration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-ci/restoration-receipt.json
          if-no-files-found: error
          retention-days: 90

  report-failure:
    needs: [gates, prepare, image, publish, mcp-registry, release, promote, restore]
    if: always() && needs.promote.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report the failed step and recovery state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHAIN_OWNER: ${{ vars.RELEASE_CHAIN_OWNER }}
          RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
          RELEASE_FAILURE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_FAILURE_RUN: ${{ inputs.action == 'restore' && inputs.receipt_run_id || '' }}
        run: node scripts/release-consumer.mjs alert distribution
      # The trusted release-pr coordinator observes this completed run and
      # emits the sole hub-facing receipt; incident details remain in Issues.
