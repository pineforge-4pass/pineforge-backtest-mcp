name: pineforge-release

# Section 3.2: the legacy three-field dispatch is deliberately rejected.
on:
  repository_dispatch:
    types: [pineforge-release]

concurrency:
  group: offline-release-control
  cancel-in-progress: false
permissions:
  contents: read
  issues: write

jobs:
  update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Mint target-scoped App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pineforge-backtest-mcp
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate artifacts and reconcile update PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          INCIDENT_TOKEN: ${{ github.token }}
          RELEASE_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          RELEASE_CHAIN_OWNER: ${{ vars.RELEASE_CHAIN_OWNER }}
        run: node scripts/release-consumer.mjs receive
      - name: Preserve the validated target for trusted coordinator reporting
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: offline-release-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-ci/release-target.json
          if-no-files-found: warn
          retention-days: 90
      # Only release-pr.yml's trusted coordinator publishes hub receipts.
      - name: Alert on setup or receiver failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHAIN_OWNER: ${{ vars.RELEASE_CHAIN_OWNER }}
        run: node scripts/release-consumer.mjs alert receiver
