name: Regenerate syminfo expected trades

on:
  workflow_dispatch:
  # Also on PRs that change the frozen feed, so the regenerated expectations
  # are produced before the workflow exists on the default branch.
  pull_request:
    paths:
      - test/fixtures/syminfo/**
      - scripts/regenerate-syminfo-trades.mjs
      - .github/workflows/regenerate-syminfo-trades.yml

permissions:
  contents: read

# Keep bot release PRs and manual runs independent, as in the Test workflow.
concurrency:
  group: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'bot/pineforge-release/') && format('regen-pr-{0}', github.event.pull_request.number) || format('regen-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'bot/pineforge-release/') }}

jobs:
  regenerate-syminfo-trades:
    name: Record gridless and gridded expected trades
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Resolve the digest-pinned engine runtime
        id: lock
        run: node scripts/release-contract.mjs show >> "$GITHUB_OUTPUT"
      - name: Pull the pinned engine runtime
        env:
          IMAGE: ${{ steps.lock.outputs.image }}
        run: docker pull "$IMAGE"
      - name: Record both engine modes on the committed feed
        env:
          PINEFORGE_DOCKER_TIMEOUT_MS: '600000'
        run: node scripts/regenerate-syminfo-trades.mjs
      - name: Upload expected trades and full engine reports for review
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: syminfo-expected-trades-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-ci/syminfo-regeneration/
          if-no-files-found: error
          retention-days: 30
